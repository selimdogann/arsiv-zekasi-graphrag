# On-premise dağıtımın kalbi: TEK bir PostgreSQL (pgvector eklentisiyle).
# Vektörler, graf (düğüm/kenar tabloları) ve denetim kaydı hep burada durur.
# Müşterinin BT ekibine "tek bir Postgres kurun, yeter" demeyi mümkün kılar.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: graphrag_db
    environment:
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: graphrag
      POSTGRES_DB: graphrag
    ports:
      - "5432:5432"
    volumes:
      - graphrag_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  graphrag_pgdata:
