# CI (Sürekli Entegrasyon) — her push ve PR'da testleri GitHub'ın bulut
# makinesinde otomatik çalıştırır. Böylece bozuk kod fark edilmeden birleşmez.
name: CI

# Tetikleyici: main'e push VE herhangi bir Pull Request açıldığında çalış.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest          # GitHub'ın sağladığı bulut makinesi
    strategy:
      matrix:
        # README "Python 3.9+" diyor: en eski desteklenen sürüm ile güncel
        # sürüm birlikte denenir, iddia her PR'da kanıtlanır.
        python-version: ["3.9", "3.12"]
    steps:
      - name: Kodu al
        uses: actions/checkout@v4    # depoyu runner'a indir

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Bağımlılıkları yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Testleri çalıştır
        run: python -m pytest -q
        # 8 Postgres testi DATABASE_URL olmadığı için kendini atlar
        # (importorskip + skipif); diğerleri çalışır. Ollama gerekmez.
